name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distribution files
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m tools.make_release
      - name: Read package version
        id: version
        run: |
          python -c "import tomllib; from pathlib import Path; print('tag=v' + tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])" >> "$GITHUB_OUTPUT"
      - name: Publish a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          current_head=$(gh api "repos/$GH_REPO/commits/HEAD" --jq .sha)
          if [ "$current_head" != "$SOURCE_SHA" ]; then
            echo "A newer commit is on the default branch; waiting for its test results."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              dist/*.whl dist/*-source.zip dist/SHA256SUMS.txt \
              --target "$SOURCE_SHA" \
              --title "BetterWay $RELEASE_TAG" \
              --notes-file CHANGELOG.md
          fi
